<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal's FM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">NOVA 😇</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <section class="music">

            <div class="album-art">
                <h1>Music That Makes You Unique 🤩</h1>
                <img
                    id="album-image"
                    src="OIP.jpeg"
                    alt="Album artwork"
                >
            </div>

            <div class="song-info">
                <h2 id="song-title">Song Name</h2>
                <p id="artist-name">Artist Name</p>
            </div>

            <div class="progress">
                <input
                    type="range"
                    id="progress-bar"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Song progress"
                >
            </div>
            <div class="volume-control">

            <span class="volume-icon">🔊</span>

             <input
                type="range"
                id="volume-bar"
                min="0"
                max="100"
                value="100"
                step="1"
                aria-label="Volume">

    <span id="volume-percentage">100%</span>

            </div>

            <audio id="audio">
                <source src="Saiyonee - Hiten.mp3" type="audio/mpeg">
                Your browser does not support audio playback.
            </audio>
            <div class="controls">

    <button
        class="previous"
        id="previous-button"
        type="button"
        aria-label="Previous song"
    >⏮</button>

    <button
        class="play"
        id="play-button"
        type="button"
        aria-label="Play"
    >▶</button>

    <button
        class="next"
        id="next-button"
        type="button"
        aria-label="Next song"
    >⏭</button>

</div>
        </section>
    </main>
    <footer>
    <div class="footer-logo">NOVA 😇</div>

    <p>Music That Makes You Unique 🎧</p>

    <p class="copyright">
        © 2026 Royal's FM. All Rights Reserved.
    </p>
</footer>
    <script src="script.js"></script>

</body>
</html>
